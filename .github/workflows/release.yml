name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-quicklook:
    name: Build QuickLook Full Plugin (Windows)
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Download & Extract OCCT 8.0.0 & 3rdparty
        shell: pwsh
        run: |
          Write-Host "Downloading OpenCASCADE 8.0.0 combined package..."
          Invoke-WebRequest -Uri "https://github.com/Open-Cascade-SAS/OCCT/releases/download/V8_0_0/occt-combined-release-pch.zip" -OutFile "occt-combined.zip"
          Write-Host "Downloading OpenCASCADE 8.0.0 3rdparty dependencies (TBB, jemalloc, freetype)..."
          Invoke-WebRequest -Uri "https://github.com/Open-Cascade-SAS/OCCT/releases/download/V8_0_0/3rdparty-vc14-64.zip" -OutFile "3rdparty.zip"
          
          Write-Host "Extracting outer archive..."
          Expand-Archive -Path "occt-combined.zip" -DestinationPath "temp_occt"
          $nestedZip = Get-ChildItem -Path "temp_occt" -Filter "*.zip" | Select-Object -First 1
          
          Write-Host "Extracting nested archive: $($nestedZip.FullName)..."
          Expand-Archive -Path $nestedZip.FullName -DestinationPath "occt"
          Remove-Item -Path "temp_occt", "occt-combined.zip" -Recurse -Force

          # If extracted into a subfolder like occt/opencascade-8.0.0-..., flatten to occt/
          if (-not (Test-Path "occt/inc")) {
            $foundInc = Get-ChildItem -Path "occt" -Recurse -Directory -Filter "inc" | Select-Object -First 1
            if ($foundInc) {
              $parentDir = $foundInc.Parent.FullName
              Write-Host "Flattening OCCT from $parentDir to occt/..."
              Get-ChildItem -Path $parentDir | ForEach-Object {
                Move-Item $_.FullName "occt/" -Force
              }
            }
          }

          Write-Host "Extracting 3rdparty dependencies..."
          Expand-Archive -Path "3rdparty.zip" -DestinationPath "temp_3rd"
          $nested3rd = Get-ChildItem -Path "temp_3rd" -Filter "*.zip" | Select-Object -First 1
          Expand-Archive -Path $nested3rd.FullName -DestinationPath "3rdparty"
          Remove-Item -Path "temp_3rd", "3rdparty.zip" -Recurse -Force

          Write-Host "Copying release-variant 3rdparty DLLs into occt/win64/vc14/bin..."
          # Inside 3rdparty-vc14-64.zip, jemalloc.dll shares the exact same filename across variants:
          #   jemalloc-vc14-64/bin/jemalloc.dll       (Release)
          #   jemalloc-vc14-64/debug/bin/jemalloc.dll (Debug, imports VCRUNTIME140D.dll + ucrtbased.dll)
          # An unfiltered recursive copy lets the debug DLL overwrite the release DLL.
          # Skip any DLL under a 'debug' directory segment, *_debug.dll, *_d.dll, or debug-named twins (*d.dll with a sibling *.dll).
          $thirdPartyRoot = (Resolve-Path "3rdparty").Path
          $copiedReleaseJemalloc = $false
          Get-ChildItem -Path $thirdPartyRoot -Recurse -Filter "*.dll" -File | ForEach-Object {
            $relPath = $_.FullName.Substring($thirdPartyRoot.Length).TrimStart('\', '/')
            if ($relPath -match '(?i)(^|[\\/])debug([\\/]|$)') { return }
            if ($_.Name -match '(?i)(_debug|_d)\.dll$') { return }
            if ($_.Name -match '(?i)^(.+)d\.dll$' -and (Test-Path (Join-Path $_.DirectoryName "$($Matches[1]).dll"))) { return }

            Copy-Item $_.FullName "occt/win64/vc14/bin/" -Force
            if ($_.Name -ieq "jemalloc.dll") {
              $copiedReleaseJemalloc = $true
            }
          }

          # Deterministic self-check: ensure staged jemalloc.dll exists and does not match any debug jemalloc.dll
          $stagedJemalloc = "occt/win64/vc14/bin/jemalloc.dll"
          if (-not $copiedReleaseJemalloc -or -not (Test-Path $stagedJemalloc)) {
            throw "Release jemalloc.dll was not staged into occt/win64/vc14/bin/!"
          }
          $stagedHash = (Get-FileHash -Path $stagedJemalloc -Algorithm SHA256).Hash
          $stagedSize = (Get-Item -Path $stagedJemalloc).Length
          Write-Host "Staged jemalloc.dll: $stagedSize bytes, SHA256=$stagedHash"

          $debugJemallocs = Get-ChildItem -Path $thirdPartyRoot -Recurse -Filter "jemalloc.dll" -File | Where-Object {
            $_.FullName.Substring($thirdPartyRoot.Length).TrimStart('\', '/') -match '(?i)(^|[\\/])debug([\\/]|$)'
          }
          foreach ($dbg in $debugJemallocs) {
            $dbgHash = (Get-FileHash -Path $dbg.FullName -Algorithm SHA256).Hash
            if ($dbgHash -eq $stagedHash) {
              throw "Staged jemalloc.dll matches debug variant at $($dbg.FullName) (SHA256=$stagedHash)!"
            }
          }

          if (-not (Test-Path "occt/inc")) { throw "occt/inc directory missing after extraction!" }
          if (-not (Test-Path "occt/win64/vc14/lib")) { throw "occt/win64/vc14/lib directory missing after extraction!" }
          if (-not (Test-Path "occt/win64/vc14/bin")) { throw "occt/win64/vc14/bin directory missing after extraction!" }
          Write-Host "OCCT 8.0.0 verified."

      - name: Build 3dmaster-preview
        shell: pwsh
        run: |
          $occtPath = (Resolve-Path "occt").Path
          cmake -B 3dmaster-preview/build -S 3dmaster-preview -G "Visual Studio 17 2022" -A x64 -DOCCT_DIR="$occtPath"
          cmake --build 3dmaster-preview/build --config Release --target 3dmaster-preview

      - name: Pack Plugin (.qlplugin & portable zip)
        shell: pwsh
        run: |
          cd QuickLook.Plugin.3DMaster
          .\pack-plugin.ps1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3dmaster-quicklook-plugins
          path: |
            QuickLook.Plugin.ThreeDMaster.qlplugin
            QuickLook.Plugin.ThreeDMaster_Portable.zip

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "### 3dmaster for Windows QuickLook (Full Edition with OpenCASCADE 8.0.0)`n`n" +
                   "Supported formats: STEP (.stp, .step), IGES (.igs, .iges), glTF (.gltf, .glb), 3MF, STL, OBJ, PLY, OFF, PRT.`n`n" +
                   "**Installation:**`n" +
                   "1. **One-Click (.qlplugin):** Download ``QuickLook.Plugin.ThreeDMaster.qlplugin``, select it in File Explorer, and press Spacebar to install automatically.`n" +
                   "2. **Manual / Portable (.zip):** Download ``QuickLook.Plugin.ThreeDMaster_Portable.zip`` and extract it into your QuickLook plugin directory.`n" +
                   "3. Restart QuickLook."

          gh release delete $tag --yes 2>$null
          gh release create $tag QuickLook.Plugin.ThreeDMaster.qlplugin QuickLook.Plugin.ThreeDMaster_Portable.zip --title "3dmaster-quicklook $tag (Full OCCT Edition)" --notes "$notes"
